name: checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The app itself runs on Node 20 (see engines in package.json), but the
          # test suite uses Node's built-in runner against TypeScript directly,
          # and that type stripping only exists from 22.18. Tests are the reason
          # this is pinned higher than engines, so do not lower it.
          node-version: 22
          cache: pnpm

      # These two need no dependency tree, so they answer in seconds. A broken map
      # or a red test should not wait on a full install.
      - name: docs
        run: node scripts/check-docs.mjs

      - name: test
        run: node --test "tests/**/*.test.ts"

      - name: install
        run: pnpm install --frozen-lockfile

      - name: types
        run: pnpm exec tsc --noEmit

      - name: lint
        run: pnpm lint

      - name: translations
        run: pnpm check:messages

  # Split out so the fast checks above are not held up by a database container.
  #
  # This job is what a migration story bought: the build reaches Payload while
  # collecting page data, so it needs a schema, and `src/migrations/` is now able to
  # put one on an empty database. Note the adapter's dev-mode push is gated on
  # NODE_ENV and cannot stand in for that here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: bodywork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d bodywork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://payload:payload@localhost:5432/bodywork
      PAYLOAD_SECRET: ci-only-never-used-to-serve-anything
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_DASHBOARD_URL: http://dash.localhost:3000
      DASHBOARD_HOST: dash.localhost
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: migrate
        run: pnpm migrate

      - name: build
        run: pnpm build
